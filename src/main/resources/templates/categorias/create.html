<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva Categoría · El Chilpayate</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/menu :: menu}"></aside>

  <main>
    <header th:replace="~{fragments/menu :: topbar}"></header>

    <div class="content">
      <div th:replace="~{fragments/menu :: alerts}"></div>

      <div class="page-header">
        <div>
          <div class="eyebrow">Catálogo</div>
          <h2>Registrar Nueva Categoría</h2>
          <p class="muted">Define una nueva sección para la carta del restaurante.</p>
        </div>
        <div>
          <a class="btn btn-secondary" th:href="@{/categorias}">← Volver al listado</a>
        </div>
      </div>

      <div class="card" style="max-width: 600px;">
        <form th:action="@{/categorias/create}" th:object="${categoria}" method="post">
          <div class="form-grid">
            <div class="full">
              <label class="form-label">Nombre de Categoría *</label>
              <input class="form-control" th:field="*{nombre}" placeholder="Ej: ALITAS, BEBIDAS, GUARNICIONES" required>
            </div>
            <div class="full">
              <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 6px;">
                <input type="checkbox" th:field="*{estado}" checked>
                <b>Categoría Activa</b>
              </label>
            </div>
          </div>
          <div style="margin-top: 24px; display: flex; gap: 10px;">
            <button type="submit" class="btn btn-primary">Guardar Categoría</button>
            <a class="btn btn-soft" th:href="@{/categorias}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
