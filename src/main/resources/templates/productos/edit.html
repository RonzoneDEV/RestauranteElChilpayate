<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Producto · El Chilpayate</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/menu :: menu}"></aside>

  <main>
    <header th:replace="~{fragments/menu :: topbar}"></header>

    <div class="content">
      <div th:replace="~{fragments/menu :: alerts}"></div>

      <div class="page-header">
        <div>
          <div class="eyebrow">Catálogo del Restaurante</div>
          <h2>Editar Producto #<span th:text="${producto.idProducto}"></span></h2>
          <p class="muted">Modifica los detalles, precios y opciones del producto.</p>
        </div>
        <div>
          <a class="btn btn-secondary" th:href="@{/productos}">← Volver al listado</a>
        </div>
      </div>

      <div class="card" style="max-width: 800px;">
        <form th:action="@{/productos/edit/{id}(id=${producto.idProducto})}" th:object="${producto}" method="post">
          <div class="form-grid">
            <div class="full">
              <label class="form-label">Nombre del Producto *</label>
              <input class="form-control" th:field="*{nombre}" required>
            </div>

            <div class="full">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" rows="2" th:field="*{descripcion}"></textarea>
            </div>

            <div>
              <label class="form-label">Categoría *</label>
              <select class="form-select" th:field="*{categoria}" required>
                <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"
                        th:selected="${producto.categoria != null and c.idCategoria == producto.categoria.idCategoria}"></option>
              </select>
            </div>

            <div>
              <label class="form-label">Tipo de Producto *</label>
              <select class="form-select" th:field="*{tipo}" required>
                <option value="PRINCIPAL">🍽 Plato Principal (Alitas, Hamburguesas, Salchipapas)</option>
                <option value="INTERMEDIO">🥤 Intermedio / Bebida (Gaseosas, Refrescos)</option>
                <option value="ADICIONAL">🌶 Salsa / Adicional (Solo con plato principal)</option>
              </select>
            </div>

            <div>
              <label class="form-label">Precio (S/) *</label>
              <input class="form-control" type="number" step="0.01" min="0.01" th:field="*{precio}" required>
            </div>

            <div>
              <label class="form-label">Stock actual</label>
              <input class="form-control" type="number" min="0" th:field="*{stock}">
            </div>

            <div>
              <label class="form-label">Ruta o URL de Imagen</label>
              <input class="form-control" th:field="*{imagen}">
            </div>

            <div>
              <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer;">
                <input type="checkbox" th:field="*{controlaStock}">
                <b>Controla Stock</b>
              </label>
            </div>

            <div>
              <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer;">
                <input type="checkbox" th:field="*{permiteCrema}">
                <b>Permite elegir cremas</b>
              </label>
            </div>

            <div>
              <label style="display: flex; align-items: center; gap: 8px; margin-top: 10px; cursor: pointer;">
                <input type="checkbox" th:field="*{permiteSalsa}">
                <b>Permite elegir salsas</b>
              </label>
            </div>

            <div>
              <label class="form-label">Límite de Salsas (si aplica)</label>
              <input class="form-control" type="number" min="0" th:field="*{limiteSalsa}">
            </div>

            <div class="full">
              <label style="display: flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer;">
                <input type="checkbox" th:field="*{estado}">
                <b>Producto Activo</b>
              </label>
            </div>
          </div>

          <div style="margin-top: 24px; display: flex; gap: 10px;">
            <button class="btn btn-primary" type="submit">Guardar Cambios</button>
            <a class="btn btn-soft" th:href="@{/productos}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
