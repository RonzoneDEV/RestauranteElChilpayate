<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo Usuario · El Chilpayate</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/menu :: menu}"></aside>

  <main>
    <header th:replace="~{fragments/menu :: topbar}"></header>

    <div class="content">
      <div th:replace="~{fragments/menu :: alerts}"></div>

      <div class="page-header">
        <div>
          <div class="eyebrow">Seguridad</div>
          <h2>Nuevo Usuario</h2>
          <p class="muted">Crea credenciales y asigna rol de operación al colaborador.</p>
        </div>
        <div>
          <a class="btn btn-secondary" th:href="@{/usuarios}">← Volver al listado</a>
        </div>
      </div>

      <div class="card" style="max-width: 700px;">
        <form th:action="@{/usuarios/create}" th:object="${usuario}" method="post">
          <div class="form-grid">
            <div>
              <label class="form-label">Nombres *</label>
              <input class="form-control" th:field="*{nombres}" placeholder="Ej: Carlos" required>
            </div>

            <div>
              <label class="form-label">Apellidos *</label>
              <input class="form-control" th:field="*{apellidos}" placeholder="Ej: Gómez" required>
            </div>

            <div class="full">
              <label class="form-label">Nombre de usuario (Login) *</label>
              <input class="form-control" th:field="*{username}" placeholder="Ej: cgomez" required>
            </div>

            <div class="full">
              <label class="form-label">Contraseña inicial *</label>
              <input class="form-control" type="password" th:field="*{password}" placeholder="••••••••" required>
            </div>

            <div>
              <label class="form-label">Rol del sistema *</label>
              <select class="form-select" th:field="*{rol.idRol}" required>
                <option value="">-- Seleccionar rol --</option>
                <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombre}"></option>
              </select>
            </div>

            <div style="display: flex; align-items: flex-end;">
              <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding-bottom: 12px;">
                <input type="checkbox" th:field="*{estado}">
                <b>Usuario Activo</b>
              </label>
            </div>
          </div>

          <div class="actions" style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Guardar usuario</button>
            <a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
</body>
</html>
